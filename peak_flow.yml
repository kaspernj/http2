rvm: true
builds:
  build_1:
    paths:
      - "lib/**"
      - "spec/**"
      - "config/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "Rakefile"
      - "http2.gemspec"
      - "peak_flow.yml"
      - "!README.md"
      - "!LICENSE.txt"
    environment:
      RUBY_VERSION: 2.7.6
    name: Ruby 2.7.6
    script:
      - bundle exec rspec
  build_2:
    paths:
      - "lib/**"
