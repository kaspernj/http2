      - "Gemfile.lock"
      - "Rakefile"
      - "http2.gemspec"
      - "peak_flow.yml"
      - "!README.md"
      - "!LICENSE.txt"
    environment:
      RUBY_VERSION: 3.1.2
    name: Ruby 3.1.2
    script:
      - bundle exec rspec
  build_4:
